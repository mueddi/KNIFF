name: Zahlungs-Abgleich (Stripe ↔ Datenbank)

# Jeden Morgen: ist jede bei Stripe bezahlte Zahlung der letzten 3 Tage in
# der App verbucht? Fehlt eine, wird der Lauf rot (GitHub schickt eine Mail)
# und die Zusammenfassung nennt die Stripe-Kennung. Hintergrund: bis zum
# 25.9. war der Webhook nie angekommen – ein Kauf waere still verloren
# gegangen. Logik: backend/app/services/abgleich.py
#
# Benoetigte Secrets (Settings -> Secrets and variables -> Actions):
#   STRIPE_ABGLEICH_KEY  eingeschraenkter LIVE-Schluessel (rk_live_…) aus
#                        Stripe -> Entwickler -> API-Schluessel -> «Eingeschränkten
#                        Schlüssel erstellen», nur LESEN fuer «Checkout Sessions»
#                        und «Invoices». Kann nichts veraendern oder abbuchen.
#   DATABASE_URL         schon vorhanden (Backup) – Session-Pooler der Produktion

on:
  schedule:
    - cron: "23 5 * * *" # taeglich 05:23 UTC (07:23 Schweizer Sommerzeit)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zahlungsabgleich
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Secrets prüfen
        env:
          STRIPE_ABGLEICH_KEY: ${{ secrets.STRIPE_ABGLEICH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$STRIPE_ABGLEICH_KEY" ]; then
            echo "::error::Secret STRIPE_ABGLEICH_KEY fehlt – eingeschränkten Live-Schlüssel (nur Lesen: Checkout Sessions, Invoices) anlegen. Solange er fehlt, prüft niemand, ob Zahlungen ankommen."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL fehlt."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements.txt

      - name: Abgleichen
        working-directory: backend
        env:
          STRIPE_ABGLEICH_KEY: ${{ secrets.STRIPE_ABGLEICH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAGE: "3"
        run: python scripts/zahlungsabgleich.py
