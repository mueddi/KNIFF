name: Deploy (Vercel)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: kaputte Commits duerfen nie live gehen. Dieselben Tests wie beim
  # Pull Request (ci.yml) - ein Setup, ein Arbeitsverzeichnis, eine
  # Python-Version; frueher liefen sie hier ein zweites Mal mit anderem
  # cwd und ungepinntem pytest und brachen anders als im PR (Lauf 114).
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Secrets prüfen
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RUNTIME_ENV_JSON: ${{ secrets.RUNTIME_ENV_JSON }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$RUNTIME_ENV_JSON" ]; then
            echo "::error::Secrets fehlen: VERCEL_TOKEN und RUNTIME_ENV_JSON unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Secrets kommen als gitignore'd Sidecar ins Deployment-Paket (api/index.py liest sie);
      # sie landen NIE im Git-Verlauf. Das separate Secret ANTHROPIC_API_KEY (einzeiliger
      # Klartext, weniger fehleranfällig beim Einfügen) überschreibt den JSON-Wert.
      # Beim Einfügen beschädigte Werte (Nicht-ASCII) werden verworfen statt deployt.
      - name: Secrets-Sidecar schreiben
        env:
          RUNTIME_ENV_JSON: ${{ secrets.RUNTIME_ENV_JSON }}
          ANTHROPIC_API_KEY_OVERRIDE: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY_IN: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_IN: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          python3 - <<'EOF'
          import json, os

          env = json.loads(os.environ["RUNTIME_ENV_JSON"])
          override = (os.environ.get("ANTHROPIC_API_KEY_OVERRIDE") or "").strip()
          if override:
              env["ANTHROPIC_API_KEY"] = override
          for name, target in (("STRIPE_SECRET_KEY_IN", "STRIPE_SECRET_KEY"),
                               ("STRIPE_WEBHOOK_SECRET_IN", "STRIPE_WEBHOOK_SECRET")):
              value = (os.environ.get(name) or "").strip()
              if value:
                  env[target] = value
          for key, value in list(env.items()):
              if isinstance(value, str) and not value.isascii():
                  print(f"::warning::{key} enthält Nicht-ASCII-Zeichen (Einfüge-Schaden) und wird verworfen")
                  env.pop(key)
          with open("api/runtime-env.json", "w") as f:
              json.dump(env, f)
          print("Sidecar geschrieben mit Schlüsseln:", sorted(env))
          EOF

      # Projekt ausdruecklich benennen, statt es die CLI raten zu lassen: ohne
      # .vercel/project.json (gitignored) leitet sie den Namen aus dem
      # Ordner ab – seit der Umbenennung des Repositories auf KNIFF war das
      # «KNIFF», und Grossbuchstaben lehnt Vercel ab (400, Lauf 116 am 9.9.).
      # Die beiden Kennungen sind keine Geheimnisse; ohne VERCEL_TOKEN
      # kann man damit nichts anfangen.
      - name: Zu Vercel deployen
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VF5wWsu4Q9kAXd24n6Vg768u
          VERCEL_PROJECT_ID: prj_CcBFBsHDyuuMHYhB3QqL95NyGRMU
        run: |
          # pipefail ist hier kein Detail, sondern der Kern: ohne ihn meldet
          # eine Verkettung den Status des LETZTEN Befehls – und `tee` gelingt
          # immer. Am 06.09. lief der Deploy in einen ungueltigen VERCEL_TOKEN,
          # lieferte nichts aus, und der Schritt meldete trotzdem "erfolgreich".
          # Aufgefallen ist es nur, weil der Smoke-Test die Datenbank-Auskunft
          # prueft. Ein Deploy, der luegt, ist schlimmer als gar keiner.
          set -o pipefail
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy-url.txt

          # Zweiter Riegel: auch ein Befehl mit Status 0 muss eine Adresse
          # geliefert haben, sonst ging nichts live.
          url=$(tail -n 1 deploy-url.txt)
          case "$url" in
            https://*) ;;
            *)
              echo "::error::Vercel hat keine Deployment-Adresse geliefert: $url"
              exit 1
              ;;
          esac

          {
            echo "### Produktions-URL"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

  # Nach dem Deploy die Live-App anstupsen: Registrierung/Login muessen gehen.
  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      # Zuerst die Auskunft: sie fasst jetzt auch die Datenbank an. Ist sie
      # beim Deploy nicht erreichbar, soll der Deploy scheitern, statt eine
      # Version live zu stellen, in der sich niemand anmelden kann.
      - name: Auskunft meldet eine erreichbare Datenbank
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            "https://kniff.app/api/health")
          echo "Health: HTTP $code"; cat /tmp/health.json; echo ""
          [ "$code" = "200" ] || exit 1
          python3 -c "
          import json
          d = json.load(open('/tmp/health.json'))
          assert d['status'] == 'ok', d
          assert d['datenbank'] is True, 'Datenbank nicht erreichbar'
          "

      # Die Oberflaeche: Startseite UND das Programm dahinter. Eine Seite, die
      # 200 liefert, aber ein kaputtes oder fehlendes JS-Paket laedt, ist fuer
      # Besucher weiss – der alte Rauchtest haette das nie bemerkt.
      - name: Startseite und App-Paket werden ausgeliefert
        run: |
          code=$(curl -sS -o /tmp/start.html -w "%{http_code}" "https://kniff.app/")
          echo "Startseite: HTTP $code"
          [ "$code" = "200" ] || exit 1
          grep -q '<div id="root">' /tmp/start.html || { echo "::error::Startseite ohne App-Wurzel"; exit 1; }
          js=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' /tmp/start.html | head -1)
          [ -n "$js" ] || { echo "::error::Kein App-Paket in der Startseite verlinkt"; exit 1; }
          code=$(curl -sS -o /tmp/app.js -w "%{http_code}" "https://kniff.app$js")
          groesse=$(wc -c < /tmp/app.js)
          echo "App-Paket $js: HTTP $code, $groesse Bytes"
          [ "$code" = "200" ] && [ "$groesse" -gt 100000 ] || { echo "::error::App-Paket fehlt oder ist zu klein"; exit 1; }
          grep -q "Mathe verstehen" /tmp/app.js || { echo "::error::App-Paket enthaelt die Startseite nicht"; exit 1; }

      - name: Unterseiten liefern die App (kein 404 beim direkten Aufruf)
        run: |
          for pfad in /login /agb /datenschutz /impressum /app/lernen /app/preise /eltern; do
            code=$(curl -sS -o /tmp/seite.html -w "%{http_code}" "https://kniff.app$pfad")
            echo "$pfad: HTTP $code"
            [ "$code" = "200" ] && grep -q '<div id="root">' /tmp/seite.html || { echo "::error::$pfad liefert die App nicht"; exit 1; }
          done

      - name: Oeffentliche Preisauskunft stimmt mit der Gesundheitsauskunft ueberein
        run: |
          curl -sS -o /tmp/preise.json "https://kniff.app/api/pay/preise"
          cat /tmp/preise.json; echo ""
          python3 -c "
          import json
          p = json.load(open('/tmp/preise.json'))
          h = json.load(open('/tmp/health.json'))
          for k in ('abo_enabled', 'plus_name', 'monat_rappen', 'jahr_rappen', 'trial_tasks', 'plus_tokens_monat', 'pakete'):
              assert k in p, k
          assert p['monat_rappen'] > 0 and p['jahr_rappen'] > 0 and p['plus_tokens_monat'] > 0, p
          assert p['zahlung'] == h['zahlung'], (p, h)
          "

      - name: Ohne Anmeldung kein Zugriff
        run: |
          for pfad in /api/quota /api/admin/kosten /api/admin/nutzer /api/feedback /api/auth/me; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://kniff.app$pfad")
            echo "$pfad ohne Anmeldung: HTTP $code"
            [ "$code" = "401" ] || { echo "::error::$pfad ist ohne Anmeldung erreichbar ($code)"; exit 1; }
          done

      - name: Registrierung (200 beim ersten Mal, 409 danach – beides ok)
        run: |
          code=$(curl -sS -o /tmp/reg.json -w "%{http_code}" -X POST \
            "https://kniff.app/api/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"email":"schrittweise.smoketest@example.com","password":"smoke-test-passwort-123","display_name":"Smoke","terms_accepted":true}')
          echo "Register: HTTP $code"; cat /tmp/reg.json; echo ""
          [ "$code" = "200" ] || [ "$code" = "409" ] || exit 1
      - name: Login muss funktionieren
        run: |
          code=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST \
            "https://kniff.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"schrittweise.smoketest@example.com","password":"smoke-test-passwort-123"}')
          echo "Login: HTTP $code"
          [ "$code" = "200" ] || { cat /tmp/login.json; exit 1; }
          python3 -c "import json; d=json.load(open('/tmp/login.json')); assert d['access_token']"
      - name: Falsches Passwort muss 401 geben
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            "https://kniff.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"schrittweise.smoketest@example.com","password":"absichtlich-falsch"}')
          echo "Falsches Passwort: HTTP $code"
          [ "$code" = "401" ] || exit 1
      - name: Kontingent liefert das neue Token-Modell
        run: |
          token=$(curl -sS -X POST "https://kniff.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"schrittweise.smoketest@example.com","password":"smoke-test-passwort-123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -sS -o /tmp/quota.json "https://kniff.app/api/quota" \
            -H "Authorization: Bearer $token"
          cat /tmp/quota.json; echo ""
          python3 -c "
          import json
          d = json.load(open('/tmp/quota.json'))
          assert 'monthly_free_tokens' in d and 'token_balance' in d and 'remaining' in d, d
          assert 'stufe' in d, d
          "
      - name: Zahlung antwortet sauber (503 ohne Keys oder Abo-Schalter / 200 mit)
        run: |
          token=$(curl -sS -X POST "https://kniff.app/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"schrittweise.smoketest@example.com","password":"smoke-test-passwort-123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          code=$(curl -sS -o /tmp/pay.json -w "%{http_code}" -X POST \
            "https://kniff.app/api/pay/checkout" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $token" \
            -d '{"intervall":"monat"}')
          echo "Checkout: HTTP $code"; cat /tmp/pay.json; echo ""
          # 409 = das Rauchtest-Konto hat schon ein Abo (nach einem echten Testkauf)
          [ "$code" = "503" ] || [ "$code" = "200" ] || [ "$code" = "409" ] || exit 1
